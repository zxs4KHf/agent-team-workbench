<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Agent 协作台</title>
  <desc id="desc">把多个 AI 会话编成一支团队：你提一个问题，Claude、GPT、GLM 等几个 Agent 分头回答，汇成一份合并稿，最后只把需要拍板的选择交给你。</desc>

  <!-- 配色取自工作台 web/v2/styles/tokens.css：暖白底、墨绿强调、琥珀表示「等你拍板」 -->
  <rect width="1200" height="400" rx="24" fill="#f4f5f2"/>

  <g id="title-block" font-family="PingFang SC, Microsoft YaHei UI, Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="64" y="96" font-family="SFMono-Regular, Cascadia Code, Consolas, ui-monospace, monospace" font-size="18" letter-spacing="2" fill="#28664b">MULTI-AGENT WORKBENCH · MCP</text>
    <text x="64" y="168" font-size="64" font-weight="700" fill="#1c241f">Agent 协作台</text>
    <text x="64" y="224" font-size="30" font-weight="600" fill="#1c241f">把多个 AI 会话编成一支团队</text>
    <text x="64" y="268" font-size="22" fill="#57625b">你只管提问和拍板，</text>
    <text x="64" y="300" font-size="22" fill="#57625b">派发、合并、施工、互审它们自己推进。</text>
    <text x="64" y="354" font-family="SFMono-Regular, Cascadia Code, Consolas, ui-monospace, monospace" font-size="18" fill="#646e67">Windows · Python 3.11 · Apache-2.0</text>
  </g>

  <g id="project-proof" font-family="PingFang SC, Microsoft YaHei UI, Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- 连线：问题 → 三个 Agent → 合并稿 → 等你拍板 -->
    <g fill="none" stroke="#c0cbc1" stroke-width="2" stroke-linecap="round">
      <path d="M888 104 C888 120 718 118 718 136"/>
      <path d="M888 104 L888 136"/>
      <path d="M888 104 C888 120 1058 118 1058 136"/>
      <path d="M718 200 C718 218 888 214 888 232"/>
      <path d="M888 200 L888 232"/>
      <path d="M1058 200 C1058 218 888 214 888 232"/>
      <path d="M888 292 L888 316"/>
    </g>

    <!-- 你提的问题 -->
    <rect x="640" y="48" width="496" height="56" rx="12" fill="#ffffff" stroke="#d9dfd9" stroke-width="1.5"/>
    <rect x="656" y="62" width="40" height="28" rx="8" fill="#fff2dc"/>
    <text x="676" y="82" font-size="18" font-weight="700" fill="#956022" text-anchor="middle">你</text>
    <text x="712" y="84" font-size="21" fill="#1c241f">内部通知选哪个消息队列？</text>

    <!-- 三个不同模型的 Agent：状态圆点 + 心跳线（工作台 Agent 卡片上的同款） -->
    <g id="agent-claude" transform="translate(640 136)">
      <rect width="156" height="64" rx="12" fill="#ffffff" stroke="#d9dfd9" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6" fill="#28664b"/>
      <text x="36" y="29" font-size="20" font-weight="700" fill="#1c241f">Claude</text>
      <path d="M16 47 H58 L64 37 L71 56 L77 42 L82 47 H140" fill="none" stroke="#28664b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="agent-gpt" transform="translate(810 136)">
      <rect width="156" height="64" rx="12" fill="#ffffff" stroke="#d9dfd9" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6" fill="#28664b"/>
      <text x="36" y="29" font-size="20" font-weight="700" fill="#1c241f">GPT</text>
      <path d="M16 47 H70 L76 37 L83 56 L89 42 L94 47 H140" fill="none" stroke="#28664b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="agent-glm" transform="translate(980 136)">
      <rect width="156" height="64" rx="12" fill="#ffffff" stroke="#d9dfd9" stroke-width="1.5"/>
      <circle cx="22" cy="22" r="6" fill="#28664b"/>
      <text x="36" y="29" font-size="20" font-weight="700" fill="#1c241f">GLM</text>
      <path d="M16 47 H46 L52 37 L59 56 L65 42 L70 47 H140" fill="none" stroke="#28664b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- 合并稿 -->
    <rect x="640" y="232" width="496" height="60" rx="12" fill="#e3f0e8"/>
    <text x="660" y="270" font-size="21" font-weight="700" fill="#1c4d37">合并稿</text>
    <text x="742" y="270" font-size="21" fill="#28664b">共识 · 分歧 · 最终方案</text>

    <!-- 等你拍板 -->
    <rect x="640" y="316" width="496" height="56" rx="12" fill="#fff2dc" stroke="#e7c48f" stroke-width="1.5"/>
    <text x="660" y="352" font-size="21" font-weight="700" fill="#956022">等你拍板</text>
    <text x="756" y="352" font-size="21" fill="#1c241f">RabbitMQ（推荐）</text>
    <rect x="1040" y="328" width="80" height="32" rx="16" fill="#28664b"/>
    <text x="1080" y="350" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">拍板</text>
  </g>
</svg>
