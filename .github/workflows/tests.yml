name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    # 工作台目前只支持 Windows（服务守护、作业对象、启动脚本），测试也在 Windows 上跑。
    # 这里只跑确定性的测试（scripts/run_tests.py --fast 跳过所有要启动浏览器的测试）；
    # 浏览器测试请在提交前本机跑一次完整的 py -3 scripts/run_tests.py（见 CONTRIBUTING.md）。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Git identity for temporary test repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Run fast tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -X utf8 scripts/run_tests.py --fast
